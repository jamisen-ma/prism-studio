<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <include ignore_missing="yes">/opt/homebrew/etc/fonts/fonts.conf</include>
  <dir prefix="relative">.</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <!-- Resolve generic families to the faces browsers use, so on-canvas text
       previews match the rendered layer. Keep in sync with client/CanvasText.tsx. -->
  <alias binding="strong"><family>sans-serif</family><prefer><family>Helvetica</family><family>Arial</family><family>Liberation Sans</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>Times New Roman</family><family>Times</family><family>Liberation Serif</family><family>DejaVu Serif</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Menlo</family><family>Courier New</family><family>Liberation Mono</family><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
